<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiScreenSaver - 主人的專屬防休眠喚醒器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #181926 0%, #24273a 100%);
            color: #cad3f5;
            padding: 20px;
        }
        .container {
            background: rgba(36, 39, 58, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .icon-wrapper {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(166, 227, 161, 0.15);
            border-radius: 50%;
        }
        .icon {
            font-size: 42px;
            z-index: 1;
        }
        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(166, 227, 161, 0.35);
            animation: pulse-animation 2s infinite;
            z-index: 0;
        }
        .paused .pulse {
            animation: none;
            background: transparent;
        }
        .paused .icon-wrapper {
            background: rgba(108, 112, 134, 0.2);
        }
        @keyframes pulse-animation {
            0% { transform: scale(0.95); opacity: 0.8; }
            70% { transform: scale(1.35); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #a6e3a1;
            transition: color 0.3s;
        }
        .paused h1 {
            color: #939ab7;
        }
        .subtitle {
            font-size: 14px;
            color: #a5adcb;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .indicators-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(166, 227, 161, 0.12);
            border: 1px solid rgba(166, 227, 161, 0.3);
            color: #a6e3a1;
            transition: all 0.3s;
        }
        .badge.inactive {
            background: rgba(108, 112, 134, 0.15);
            border-color: rgba(108, 112, 134, 0.3);
            color: #939ab7;
        }
        .indicator-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #a6e3a1;
        }
        .badge.inactive .indicator-dot {
            background: #939ab7;
        }
        .timer-box {
            background: rgba(30, 32, 48, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .timer-label {
            font-size: 12px;
            color: #8087a2;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .timer-value {
            font-family: "Courier New", Courier, monospace;
            font-size: 32px;
            font-weight: bold;
            color: #f5bde6;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .button {
            background: #8aadf4;
            color: #181926;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .button:hover {
            background: #b7bdf8;
            transform: translateY(-1px);
        }
        .button.pause-btn {
            background: #ee99a0;
        }
        .button.pause-btn:hover {
            background: #f5a97f;
        }
        .button.pip-btn {
            background: rgba(203, 166, 247, 0.2);
            color: #cba6f7;
            border: 1px solid rgba(203, 166, 247, 0.4);
        }
        .button.pip-btn:hover {
            background: rgba(203, 166, 247, 0.35);
        }
        .footer-note {
            font-size: 12px;
            color: #8087a2;
            line-height: 1.6;
            text-align: left;
            background: rgba(24, 25, 38, 0.6);
            padding: 12px 16px;
            border-radius: 10px;
        }
        /* 隱藏的 Canvas 與 Video (畫中畫用) */
        #pipCanvas {
            display: none;
        }
        #pipVideo {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container" id="card">
        <div class="icon-wrapper">
            <div class="pulse"></div>
            <div class="icon" id="statusIcon">☕</div>
        </div>

        <h1 id="titleText">防休眠運行中</h1>
        <p class="subtitle" id="subtitleText">三重喚醒守護已啟動：Screen WakeLock + WebAudio 次音頻 + 畫中畫</p>

        <div class="indicators-grid">
            <div class="badge" id="badgeWakeLock">
                <span class="indicator-dot"></span>
                <span>顯示器喚醒鎖定</span>
            </div>
            <div class="badge" id="badgeWebAudio">
                <span class="indicator-dot"></span>
                <span>背景次音頻防凍</span>
            </div>
        </div>

        <div class="timer-box">
            <div class="timer-label">已為主人維持清醒時間</div>
            <div class="timer-value" id="timer">00:00:00</div>
        </div>

        <div class="button-group">
            <button class="button pause-btn" id="toggleBtn" onclick="toggleWakeLock()">暫停防休眠</button>
            <button class="button pip-btn" id="pipBtn" onclick="togglePiP()">🖼️ 啟用懸浮畫中畫（終極防背景休眠）</button>
        </div>

        <div class="footer-note">
            💡 <strong>守護機制說明：</strong><br>
            1. <strong>次音頻保護</strong>：啟用人耳聽不見的微弱無聲波，防止分頁切換到背景時被瀏覽器暫停。<br>
            2. <strong>懸浮畫中畫</strong>：若需最小化瀏覽器，點擊啟用畫中畫置頂小視窗，可 100% 保持在前景活躍。
        </div>
    </div>

    <!-- 畫中畫 (PiP) 專用串流渲染 Canvas 與隱藏 Video -->
    <canvas id="pipCanvas" width="320" height="180"></canvas>
    <video id="pipVideo" autoplay muted playsinline></video>

    <script>
        let wakeLock = null;
        let isActive = true;
        let startTime = Date.now();
        let timerInterval = null;
        let audioContext = null;
        let audioSource = null;
        let pipCanvas = null;
        let pipVideo = null;
        let pipCanvasInterval = null;

        // 1. 初始化計時器
        function updateTimer() {
            if (!isActive) return;
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const hrs = String(Math.floor(diff / 3600)).padStart(2, '0');
            const mins = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
            const secs = String(diff % 60).padStart(2, '0');
            const timeStr = `${hrs}:${mins}:${secs}`;
            document.getElementById('timer').innerText = timeStr;
            renderPipFrame(timeStr);
        }

        // 2. Web Audio API：次音頻產生器 (解決背景分頁凍結問題)
        function startWebAudioKeepAlive() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                if (audioSource) {
                    try { audioSource.stop(); } catch(e) {}
                }

                // 建立 1 秒長度之微弱次音頻 (25Hz，振幅 0.0005，人耳實質無聲)
                const sampleRate = audioContext.sampleRate;
                const buffer = audioContext.createBuffer(1, sampleRate, sampleRate);
                const channelData = buffer.getChannelData(0);
                for (let i = 0; i < sampleRate; i++) {
                    channelData[i] = Math.sin((2 * Math.PI * 25 * i) / sampleRate) * 0.0005;
                }

                audioSource = audioContext.createBufferSource();
                audioSource.buffer = buffer;
                audioSource.loop = true;
                audioSource.connect(audioContext.destination);
                audioSource.start();

                document.getElementById('badgeWebAudio').className = 'badge';
                return true;
            } catch (err) {
                console.warn('WebAudio 初始化警告:', err);
                document.getElementById('badgeWebAudio').className = 'badge inactive';
                return false;
            }
        }

        function stopWebAudioKeepAlive() {
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                try { audioContext.suspend(); } catch(e) {}
            }
            document.getElementById('badgeWebAudio').className = 'badge inactive';
        }

        // 3. Screen Wake Lock API
        async function acquireWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        if (isActive && document.visibilityState === 'visible') {
                            setTimeout(acquireWakeLock, 1000);
                        } else if (document.visibilityState !== 'visible') {
                            document.getElementById('badgeWakeLock').className = 'badge inactive';
                        }
                    });
                    document.getElementById('badgeWakeLock').className = 'badge';
                    return true;
                } catch (err) {
                    console.warn('Wake Lock request error:', err);
                }
            }
            document.getElementById('badgeWakeLock').className = 'badge inactive';
            return false;
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try { await wakeLock.release(); } catch(e) {}
                wakeLock = null;
            }
            document.getElementById('badgeWakeLock').className = 'badge inactive';
        }

        // 4. 畫中畫 (Picture-in-Picture) 模式：終極解決背景分頁休眠
        function setupPipCanvas() {
            pipCanvas = document.getElementById('pipCanvas');
            pipVideo = document.getElementById('pipVideo');
            if (!pipCanvas || !pipVideo) return;

            renderPipFrame("00:00:00");
            try {
                if (!pipVideo.srcObject) {
                    pipVideo.srcObject = pipCanvas.captureStream(10);
                }
            } catch (e) {
                console.warn('Canvas captureStream error:', e);
            }
        }

        function renderPipFrame(timeText) {
            if (!pipCanvas) return;
            const ctx = pipCanvas.getContext('2d');
            ctx.fillStyle = '#181926';
            ctx.fillRect(0, 0, pipCanvas.width, pipCanvas.height);

            // 繪製光暈與文字
            ctx.fillStyle = '#a6e3a1';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('☕ AntiScreenSaver 清醒中', 160, 60);

            ctx.fillStyle = '#f5bde6';
            ctx.font = 'bold 36px monospace';
            ctx.fillText(timeText, 160, 115);

            ctx.fillStyle = '#8087a2';
            ctx.font = '14px sans-serif';
            ctx.fillText('保持懸浮即可 100% 防止休眠', 160, 150);
        }

        async function togglePiP() {
            setupPipCanvas();
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await pipVideo.play();
                    await pipVideo.requestPictureInPicture();
                }
            } catch (err) {
                alert('瀏覽器畫中畫功能提示：\n' + err.message);
            }
        }

        // 5. 更新 UI 狀態
        function updateUI(active) {
            const card = document.getElementById('card');
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('titleText');
            const subtitle = document.getElementById('subtitleText');
            const toggleBtn = document.getElementById('toggleBtn');

            if (active) {
                card.classList.remove('paused');
                icon.innerText = '☕';
                title.innerText = '防休眠運行中';
                subtitle.innerText = '三重喚醒守護已啟動：Screen WakeLock + WebAudio 次音頻 + 畫中畫';
                toggleBtn.innerText = '暫停防休眠';
                toggleBtn.className = 'button pause-btn';
            } else {
                card.classList.add('paused');
                icon.innerText = '💤';
                title.innerText = '已暫停防休眠';
                subtitle.innerText = '防休眠已暫停，系統將依照 Windows 原生設定進入睡眠或保護狀態';
                toggleBtn.innerText = '恢復防休眠';
                toggleBtn.className = 'button';
            }
        }

        // 6. 切換開關
        async function toggleWakeLock() {
            if (isActive) {
                isActive = false;
                await releaseWakeLock();
                stopWebAudioKeepAlive();
                updateUI(false);
            } else {
                isActive = true;
                startTime = Date.now();
                await acquireWakeLock();
                startWebAudioKeepAlive();
                updateUI(true);
            }
        }

        // 7. 分頁切換能動態感知
        document.addEventListener('visibilitychange', async () => {
            if (isActive) {
                if (document.visibilityState === 'visible') {
                    await acquireWakeLock();
                }
                // 確保背景時 WebAudio 繼續運作
                startWebAudioKeepAlive();
            }
        });

        // 點擊頁面任何地方觸發 Web Audio 解除 Autoplay 限制
        document.addEventListener('click', () => {
            if (isActive && (!audioContext || audioContext.state === 'suspended')) {
                startWebAudioKeepAlive();
            }
        }, { once: true });

        // 頁面載入自動初始化
        window.addEventListener('DOMContentLoaded', () => {
            acquireWakeLock();
            startWebAudioKeepAlive();
            setupPipCanvas();
            timerInterval = setInterval(updateTimer, 1000);
        });
    </script>
</body>
</html>
